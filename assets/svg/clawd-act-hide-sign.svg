<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <!-- Hide sign: hides behind an "AKU NGGAK ADA" sign; feet shuffle, it peeks over the top and ducks. 5s loop. -->
  <defs>
    <style>
      .peek { animation: peek 5s infinite ease-in-out; }
      .shuffle { animation: shuffle 0.8s infinite steps(2, end); }
      .eyes { animation: look 5s infinite ease-in-out; }

      @keyframes peek {
        0%, 30%, 62%, 100% { transform: translateY(0); }
        38%, 54% { transform: translateY(-6.5px); }
      }
      @keyframes shuffle {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(0.5px); }
      }
      @keyframes look {
        0%, 40% { transform: translateX(0); }
        44%, 48% { transform: translateX(-1px); }
        50%, 54% { transform: translateX(1px); }
        58%, 100% { transform: translateX(0); }
      }
    </style>
  </defs>

  <rect x="3" y="15" width="9" height="1" opacity="0.5"/>
  <g class="peek">
    <g fill="#DE886D">
      <rect x="2" y="6" width="11" height="7"/>
    </g>
    <g class="eyes">
      <rect x="4" y="8" width="1" height="2"/>
      <rect x="10" y="8" width="1" height="2"/>
    </g>
  </g>
  <g class="shuffle" fill="#DE886D">
    <rect x="3" y="13" width="1" height="2"/>
    <rect x="5" y="13" width="1" height="2"/>
    <rect x="9" y="13" width="1" height="2"/>
    <rect x="11" y="13" width="1" height="2"/>
  </g>

  <!-- the sign, in front -->
  <rect x="7" y="12" width="1" height="3.5" fill="#8B5A3C"/>
  <rect x="-1.5" y="3.5" width="18" height="9" fill="#2B2118"/>
  <rect x="-1" y="4" width="17" height="8" fill="#FFFAF2"/>
  <g fill="#2B2118" font-family="Consolas, 'Courier New', monospace" font-weight="bold" text-anchor="middle">
    <text x="7.5" y="7.4" font-size="3">AKU</text>
    <text x="7.5" y="10.9" font-size="2.6">NGGAK ADA</text>
  </g>
</svg>
