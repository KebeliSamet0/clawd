<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <!-- Potato: POOF, it's a potato for a few seconds (blinking, wobbling), POOF, back to normal. 5s loop. -->
  <defs>
    <style>
      .clawd { animation: clawd 5s infinite steps(1, end); }
      .potato { animation: potato 5s infinite steps(1, end); }
      .wobble { transform-origin: 7.5px 15px; animation: wobble 1s infinite ease-in-out; }
      .poof { transform-origin: 7.5px 10px; opacity: 0; animation: poof 5s infinite; }
      .blink { transform-origin: 7.5px 10.5px; animation: blink 5s infinite; }

      @keyframes clawd { 0%, 15% { opacity: 1; } 16%, 79% { opacity: 0; } 80%, 100% { opacity: 1; } }
      @keyframes potato { 0%, 15% { opacity: 0; } 16%, 79% { opacity: 1; } 80%, 100% { opacity: 0; } }
      @keyframes wobble {
        0%, 100% { transform: rotate(-4deg); }
        50% { transform: rotate(4deg); }
      }
      @keyframes poof {
        0%, 12% { opacity: 0; transform: scale(0.4); }
        15% { opacity: 1; transform: scale(1); }
        20% { opacity: 0; transform: scale(1.3); }
        76% { opacity: 0; transform: scale(0.4); }
        79% { opacity: 1; transform: scale(1); }
        84%, 100% { opacity: 0; transform: scale(1.3); }
      }
      @keyframes blink {
        0%, 40%, 44%, 64%, 68%, 100% { transform: scaleY(1); }
        42%, 66% { transform: scaleY(0.1); }
      }
    </style>
  </defs>

  <rect x="3" y="15" width="9" height="1" opacity="0.5"/>
  <g class="clawd">
    <g fill="#DE886D">
      <rect x="3" y="13" width="1" height="2"/>
      <rect x="5" y="13" width="1" height="2"/>
      <rect x="9" y="13" width="1" height="2"/>
      <rect x="11" y="13" width="1" height="2"/>
      <rect x="2" y="6" width="11" height="7"/>
      <rect x="0" y="9" width="2" height="2"/>
      <rect x="13" y="9" width="2" height="2"/>
    </g>
    <rect x="4" y="8" width="1" height="2"/>
    <rect x="10" y="8" width="1" height="2"/>
  </g>

  <g class="potato">
    <g class="wobble">
      <g fill="#B07A45">
        <rect x="4" y="6" width="7" height="1"/>
        <rect x="2" y="7" width="11" height="7"/>
        <rect x="1" y="8" width="13" height="5"/>
        <rect x="3" y="14" width="9" height="1"/>
      </g>
      <g fill="#8A5A2E">
        <rect x="3" y="12" width="1" height="1"/>
        <rect x="11" y="8" width="1" height="1"/>
        <rect x="7" y="13" width="1" height="1"/>
        <rect x="12" y="11" width="1" height="1"/>
      </g>
      <g class="blink">
        <rect x="5" y="9.5" width="1" height="2"/>
        <rect x="9" y="9.5" width="1" height="2"/>
      </g>
    </g>
  </g>

  <g class="poof" fill="#F1F1F1">
    <rect x="1" y="5" width="13" height="10"/>
    <rect x="-1" y="7" width="17" height="6"/>
    <rect x="3" y="3" width="9" height="14"/>
    <rect x="-2" y="4" width="3" height="3" fill="#D9D9D9"/>
    <rect x="14" y="13" width="3" height="3" fill="#D9D9D9"/>
  </g>
</svg>
