<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <!-- Drink: offers a glass of water, sips it (eyes closed), a drop falls, glass refills. 4s loop. -->
  <defs>
    <style>
      .body { animation: bob 4s infinite ease-in-out; }
      .eyes { transform-origin: 7.5px 9px; animation: sip-eyes 4s infinite; }
      .hand { transform-origin: 14px 10px; animation: sip 4s infinite ease-in-out; }
      .water { transform-origin: 16px 10px; animation: drain 4s infinite; }
      .drop { animation: drop 4s infinite; }

      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-0.5px); }
      }
      @keyframes sip {
        0%, 20% { transform: translate(0, 0) rotate(0deg); }
        32%, 60% { transform: translate(-3px, -4px) rotate(-40deg); }
        74%, 100% { transform: translate(0, 0) rotate(0deg); }
      }
      @keyframes drain {
        0%, 32% { transform: scaleY(1); }
        60%, 90% { transform: scaleY(0.25); }
        100% { transform: scaleY(1); }
      }
      @keyframes sip-eyes {
        0%, 30%, 64%, 100% { transform: scaleY(1); }
        34%, 60% { transform: scaleY(0.2); }
      }
      @keyframes drop {
        0%, 62% { opacity: 0; transform: translate(0, 0); }
        66% { opacity: 1; }
        84% { opacity: 0; transform: translate(0.5px, 5px); }
        100% { opacity: 0; }
      }
    </style>
  </defs>

  <rect x="3" y="15" width="9" height="1" opacity="0.5"/>
  <g fill="#DE886D">
    <rect x="3" y="13" width="1" height="2"/>
    <rect x="5" y="13" width="1" height="2"/>
    <rect x="9" y="13" width="1" height="2"/>
    <rect x="11" y="13" width="1" height="2"/>
  </g>

  <g class="body">
    <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
    <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
    <g class="eyes">
      <rect x="4" y="8" width="1" height="2"/>
      <rect x="10" y="8" width="1" height="2"/>
    </g>
  </g>

  <g class="hand">
    <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
    <rect x="14" y="4" width="4" height="6" fill="#EAF6FF" opacity="0.9"/>
    <rect class="water" x="14.5" y="6" width="3" height="4" fill="#5EC2FF"/>
    <g fill="#9DBBD0">
      <rect x="14" y="4" width="0.5" height="6"/>
      <rect x="17.5" y="4" width="0.5" height="6"/>
      <rect x="14" y="9.5" width="4" height="0.5"/>
    </g>
  </g>

  <rect class="drop" x="11.5" y="10" width="1" height="1" fill="#5EC2FF"/>
</svg>
