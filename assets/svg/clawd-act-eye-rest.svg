<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <!-- Eye rest: covers its eyes with its hands, then gazes at a far-away tree. 5s loop. -->
  <defs>
    <style>
      .arm-l { animation: cover-l 5s infinite ease-in-out; }
      .arm-r { animation: cover-r 5s infinite ease-in-out; }
      .palms { animation: palms 5s infinite; }
      .eyes { animation: gaze 5s infinite ease-in-out; }
      .far { animation: far 5s infinite; }
      .dot1 { animation: dot 5s infinite; animation-delay: 0s; }
      .dot2 { animation: dot 5s infinite; animation-delay: 0.15s; }
      .dot3 { animation: dot 5s infinite; animation-delay: 0.3s; }

      @keyframes cover-l {
        0%, 6%, 48%, 100% { transform: translate(0, 0); }
        14%, 40% { transform: translate(3.5px, -1px); }
      }
      @keyframes cover-r {
        0%, 6%, 48%, 100% { transform: translate(0, 0); }
        14%, 40% { transform: translate(-3.5px, -1px); }
      }
      @keyframes palms {
        0%, 12%, 42%, 100% { opacity: 0; }
        14%, 40% { opacity: 1; }
      }
      @keyframes gaze {
        0%, 50% { transform: translate(0, 0); }
        56%, 92% { transform: translate(1px, -1px); }
        100% { transform: translate(0, 0); }
      }
      @keyframes far {
        0%, 54% { opacity: 0; }
        60%, 92% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes dot {
        0%, 56% { opacity: 0; }
        62%, 92% { opacity: 0.7; }
        100% { opacity: 0; }
      }
    </style>
  </defs>

  <rect x="3" y="15" width="9" height="1" opacity="0.5"/>
  <g fill="#DE886D">
    <rect x="3" y="13" width="1" height="2"/>
    <rect x="5" y="13" width="1" height="2"/>
    <rect x="9" y="13" width="1" height="2"/>
    <rect x="11" y="13" width="1" height="2"/>
    <rect x="2" y="6" width="11" height="7"/>
  </g>
  <g class="eyes">
    <rect x="4" y="8" width="1" height="2"/>
    <rect x="10" y="8" width="1" height="2"/>
  </g>
  <rect class="arm-l" x="0" y="9" width="2" height="2" fill="#DE886D"/>
  <rect class="arm-r" x="13" y="9" width="2" height="2" fill="#DE886D"/>
  <!-- hands over the eyes, a shade darker so they read against the body -->
  <g class="palms" fill="#C46F55">
    <rect x="3.5" y="8" width="2" height="2"/>
    <rect x="9.5" y="8" width="2" height="2"/>
  </g>

  <!-- the faraway tree it looks at, with dots for the line of sight -->
  <g fill="#9DB0C4">
    <rect class="dot1" x="14" y="4" width="1" height="1"/>
    <rect class="dot2" x="17" y="2" width="1" height="1"/>
    <rect class="dot3" x="20" y="0" width="1" height="1"/>
  </g>
  <g class="far">
    <rect x="23" y="-6" width="3" height="3" fill="#6BBF59"/>
    <rect x="22" y="-4" width="5" height="2" fill="#5AA84A"/>
    <rect x="24" y="-2" width="1" height="2" fill="#8B5A3C"/>
  </g>
</svg>
