<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <!-- Wave: raises a hand and waves goodbye, smiling. 1.2s loop. -->
  <defs>
    <style>
      .hand { transform-origin: 14px 11px; animation: wave 0.6s infinite ease-in-out alternate; }
      .lean { transform-origin: 7.5px 15px; animation: lean 1.2s infinite ease-in-out; }
      .eyes { transform-origin: 7.5px 9px; animation: smile 1.2s infinite; }

      @keyframes wave {
        from { transform: rotate(-22deg); }
        to { transform: rotate(18deg); }
      }
      @keyframes lean {
        0%, 100% { transform: rotate(-2deg); }
        50% { transform: rotate(2deg); }
      }
      @keyframes smile {
        0%, 100% { transform: scaleY(0.35); }
      }
    </style>
  </defs>

  <rect x="3" y="15" width="9" height="1" opacity="0.5"/>
  <g fill="#DE886D">
    <rect x="3" y="13" width="1" height="2"/>
    <rect x="5" y="13" width="1" height="2"/>
    <rect x="9" y="13" width="1" height="2"/>
    <rect x="11" y="13" width="1" height="2"/>
  </g>
  <g class="lean">
    <g fill="#DE886D">
      <rect x="2" y="6" width="11" height="7"/>
      <rect x="0" y="9" width="2" height="2"/>
    </g>
    <g class="eyes">
      <rect x="4" y="8" width="1" height="2"/>
      <rect x="10" y="8" width="1" height="2"/>
    </g>
    <g class="hand" fill="#DE886D">
      <rect x="13" y="3" width="2" height="8"/>
      <rect x="12.5" y="1.5" width="3" height="2"/>
    </g>
  </g>
</svg>
