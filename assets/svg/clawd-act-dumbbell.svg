<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <!-- Dumbbell: strains to lift a heavy barbell... the weights turn out to be balloons and float off. 5s loop. -->
  <defs>
    <style>
      .arm { animation: lift 5s infinite ease-in-out; }
      .bar { animation: bar 5s infinite ease-in-out; }
      .strain { animation: strain 0.16s infinite steps(2, end); }
      .plates { animation: plates 5s infinite steps(1, end); }
      .balloons { animation: balloons 5s infinite steps(1, end); }
      .eyes { transform-origin: 7.5px 9px; animation: eyes 5s infinite; }
      .body { transform-origin: 7.5px 13px; animation: body 5s infinite ease-in-out; }

      @keyframes lift {
        0%, 8%, 96%, 100% { y: 9px; height: 2px; }
        30%, 50% { y: 2px; height: 9px; }
        60%, 90% { y: 9px; height: 2px; }
      }
      @keyframes bar {
        0%, 8% { transform: translateY(7px); }
        30%, 50% { transform: translateY(0); }
        88% { transform: translateY(-22px); }
        89%, 95% { transform: translateY(-22px); opacity: 0; }
        96%, 100% { transform: translateY(7px); opacity: 1; }
      }
      @keyframes strain {
        0%, 100% { transform: translateX(-0.2px); }
        50% { transform: translateX(0.2px); }
      }
      @keyframes plates { 0%, 52% { opacity: 1; } 53%, 95% { opacity: 0; } 96%, 100% { opacity: 1; } }
      @keyframes balloons { 0%, 52% { opacity: 0; } 53%, 95% { opacity: 1; } 96%, 100% { opacity: 0; } }
      @keyframes eyes {
        0%, 10%, 52%, 100% { transform: scaleY(1); }
        14%, 50% { transform: scaleY(0.3); }
        56%, 92% { transform: scaleY(1.4); }
      }
      @keyframes body {
        0%, 10%, 52%, 100% { transform: scaleY(1); }
        20%, 48% { transform: scaleY(0.92); }
      }
    </style>
  </defs>

  <rect x="3" y="15" width="9" height="1" opacity="0.5"/>
  <g fill="#DE886D">
    <rect x="3" y="13" width="1" height="2"/>
    <rect x="5" y="13" width="1" height="2"/>
    <rect x="9" y="13" width="1" height="2"/>
    <rect x="11" y="13" width="1" height="2"/>
  </g>
  <g class="strain">
    <g class="body">
      <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
      <g class="eyes">
        <rect x="4" y="8" width="1" height="2"/>
        <rect x="10" y="8" width="1" height="2"/>
      </g>
    </g>
    <g fill="#DE886D">
      <rect class="arm" x="0" y="9" width="2" height="2"/>
      <rect class="arm" x="13" y="9" width="2" height="2"/>
    </g>
  </g>

  <g class="bar">
    <rect x="-4" y="1.5" width="23" height="0.8" fill="#9AA5B1"/>
    <g class="plates" fill="#3A3F47">
      <rect x="-5" y="-1" width="2" height="6"/>
      <rect x="-3" y="0" width="1" height="4"/>
      <rect x="16" y="0" width="1" height="4"/>
      <rect x="17" y="-1" width="2" height="6"/>
    </g>
    <g class="balloons">
      <circle cx="-4" cy="-2" r="2.5" fill="#E8453C"/>
      <circle cx="18" cy="-2" r="2.5" fill="#3D7BE0"/>
      <rect x="-4.2" y="0.5" width="0.3" height="1.2" fill="#5D6B79"/>
      <rect x="17.8" y="0.5" width="0.3" height="1.2" fill="#5D6B79"/>
      <rect x="-5" y="-3.5" width="0.8" height="0.8" fill="#FFFFFF" opacity="0.7"/>
      <rect x="17" y="-3.5" width="0.8" height="0.8" fill="#FFFFFF" opacity="0.7"/>
    </g>
  </g>
</svg>
